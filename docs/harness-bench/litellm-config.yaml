# LiteLLM proxy config: expose an Anthropic /v1/messages endpoint that Claude
# Code can talk to, and forward it to Ollama's OpenAI-compatible API.
#
# Values come from the environment (see docker-compose.yml) so no host or secret
# is committed. The local Ollama proxy ignores auth, so OLLAMA_API_KEY /
# LITELLM_MASTER_KEY are harmless dummies.
model_list:
  # The model cpe selects via `--model gemma4-cpe:31b`.
  - model_name: gemma4-cpe:31b
    litellm_params:
      model: openai/gemma4-cpe:31b
      api_base: os.environ/OLLAMA_OPENAI_BASE_URL
      api_key: os.environ/OLLAMA_API_KEY
  # Catch-all: Claude Code also issues background calls under other model names
  # (e.g. a small "haiku" model for titles). Route them all to the same local
  # model so nothing escapes to api.anthropic.com.
  - model_name: "*"
    litellm_params:
      model: openai/gemma4-cpe:31b
      api_base: os.environ/OLLAMA_OPENAI_BASE_URL
      api_key: os.environ/OLLAMA_API_KEY

litellm_settings:
  drop_params: true        # silently drop request params Ollama doesn't accept

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
