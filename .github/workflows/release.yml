name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            asset: cpe-linux-x64
          - target: bun-linux-arm64
            asset: cpe-linux-arm64
          - target: bun-darwin-x64
            asset: cpe-darwin-x64
          - target: bun-darwin-arm64
            asset: cpe-darwin-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: >
          bun build --compile --target=${{ matrix.target }}
          --define 'process.env.CPE_VERSION="${{ github.ref_name }}"'
          --outfile ${{ matrix.asset }}
          src/index.ts
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk "/^## ${TAG} *$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md \
            > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." \
              > release_notes.md
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          FLAGS=()
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "cpe $TAG" \
            --notes-file release_notes.md \
            "${FLAGS[@]}" \
            artifacts/cpe-linux-x64/cpe-linux-x64 \
            artifacts/cpe-linux-arm64/cpe-linux-arm64 \
            artifacts/cpe-darwin-x64/cpe-darwin-x64 \
            artifacts/cpe-darwin-arm64/cpe-darwin-arm64 \
            scripts/install.sh
