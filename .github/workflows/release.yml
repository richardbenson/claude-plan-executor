name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            asset: cpe-linux-x64
          - target: bun-linux-arm64
            asset: cpe-linux-arm64
          - target: bun-darwin-x64
            asset: cpe-darwin-x64
          - target: bun-darwin-arm64
            asset: cpe-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: >
          bun build --compile --target=${{ matrix.target }}
          --define 'process.env.CPE_VERSION="${{ github.ref_name }}"'
          --outfile ${{ matrix.asset }}
          src/index.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/cpe-linux-x64/cpe-linux-x64 \
            artifacts/cpe-linux-arm64/cpe-linux-arm64 \
            artifacts/cpe-darwin-x64/cpe-darwin-x64 \
            artifacts/cpe-darwin-arm64/cpe-darwin-arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
